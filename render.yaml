services:
  - type: web
    name: mini-ats-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    dockerCommand: sh -c 'uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-10000}'
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mini-ats-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "480"
      - key: CORS_ORIGINS
        value: http://localhost:5173,http://127.0.0.1:5173

databases:
  - name: mini-ats-db
    databaseName: miniats
    user: miniats
    plan: free
